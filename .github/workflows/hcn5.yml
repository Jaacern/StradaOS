name: Análisis HCN (#5)
# Baja los archivos que adjuntó zer0bytz en el issue #5 y muestra en el registro solo lo necesario para
# hablar con el servicio «sourceinfo» de las pantallas HCN: los métodos de ISourceService/ISourceCallback,
# los campos de MusicInfo y cómo los usa el launcher de fábrica. No se sube ningún archivo de la marca.
on:
  push:
    branches: [ 'analisis-hcn5' ]
permissions:
  contents: read
jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar adjuntos
        run: |
          mkdir -p z && cd z
          curl -sSL -o diag.zip https://github.com/user-attachments/files/34583465/HCN_Diagnostics_Offline_AA_Retry.zip
          curl -sSL -o dev.zip https://github.com/user-attachments/files/34583464/HCN_SourceInfo_Developer_Package.zip
          ls -la; file *.zip
          mkdir -p diag dev
          unzip -q -o diag.zip -d diag || true
          unzip -q -o dev.zip -d dev || true
          # los zip de adentro (Trace, Launcher, DEX)
          for i in 1 2 3; do
            find dev -name '*.zip' ! -name '*.done' | while read q; do d="${q%.zip}"; mkdir -p "$d"; unzip -q -o "$q" -d "$d" || true; mv "$q" "$q.done"; done
          done
          echo "===== ARCHIVOS"; find diag dev -type f -printf '%s\t%p\n' | sort -k2
      - name: Diagnósticos de texto
        run: |
          cd z/diag
          find . -type f \( -iname '*.txt' -o -iname '*.log' -o -iname '*.md' \) | while read f; do
            echo "=================== $f"; head -c 20000 "$f"; echo
          done
          cd ../dev
          find . -type f \( -iname '*.txt' -o -iname '*.log' -o -iname '*.md' -o -iname '*.aidl' \) | while read f; do
            echo "=================== $f"; head -c 6000 "$f"; echo
          done
      - name: Herramientas
        run: |
          U=$(curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/skylot/jadx/releases/latest | grep -o 'https://[^"]*/jadx-[0-9.]*\.zip' | head -1)
          echo "jadx: $U"; curl -sSL -o jadx.zip "$U"
          unzip -q jadx.zip -d jadx && chmod +x jadx/bin/jadx && ./jadx/bin/jadx --version
          curl -sSL -o vdex.zip https://github.com/anestisb/vdexExtractor/archive/refs/heads/master.zip && unzip -q vdex.zip
          sudo apt-get install -y -q zlib1g-dev >/dev/null 2>&1 || true
          sed -i 's/-Werror//g' vdexExtractor-master/src/Makefile* 2>/dev/null || true
          (cd vdexExtractor-master && ./make.sh gcc 2>&1 | tail -6; ls -la bin) || echo "vdexExtractor no compiló"
      - name: Sacar DEX de los vdex/odex/apk/jar
        run: |
          mkdir -p dex
          find z/dev -type f \( -iname '*.vdex' \) | while read f; do
            echo "== $f"; ./vdexExtractor-master/bin/vdexExtractor -i "$f" -o dex/ 2>&1 | tail -5 || true
          done
          # jar/apk con classes.dex adentro
          find z/dev -type f \( -iname '*.jar' -o -iname '*.apk' \) | while read f; do
            n=$(basename "$f"); if unzip -l "$f" 2>/dev/null | grep -q 'classes.*\.dex'; then echo "$n trae dex"; else echo "$n sin dex (odex/vdex)"; fi
          done
          find z/dev -type f \( -iname '*.dex' -o -iname '*.apk' -o -iname '*.jar' \) -exec cp {} dex/ \; 2>/dev/null || true
          ls -la dex
      - name: Buscar el servicio sourceinfo
        run: |
          mkdir -p out
          echo "===== ¿Qué archivos nombran sourceservice?"
          grep -rlas 'sourceservice' z/dev | head -30
          for f in dex/*; do
            if strings -a "$f" | grep -q 'sourceservice'; then
              echo "=== $f menciona sourceservice"
              ./jadx/bin/jadx -q -j 2 -d "out/$(basename $f)" --no-res "$f" 2>&1 | tail -3 || true
            fi
          done
          echo "===== LLAMADAS a android.sourceservice (dexdump)"
          DD=$(ls $ANDROID_HOME/build-tools/*/dexdump | tail -1)
          for f in dex/*; do "$DD" -d "$f" 2>/dev/null | grep -o 'Landroid/sourceservice/[A-Za-z$]*;\.[A-Za-z_$<>]*:[^ ]*' ; done | sort | uniq -c | sort -rn | head -80
          echo "===== CLASES android.sourceservice"
          find out -path '*android/sourceservice/*.java' | sort | while read j; do
            echo "=================== $j"; cat "$j"
          done
          echo "===== QUIÉN LAS USA (fuera del paquete)"
          grep -rln 'sourceservice\|SourceInfo\|MusicInfo' out --include=*.java | grep -v 'android/sourceservice/' | head -20 | while read j; do
            echo "=================== $j"
            grep -n -B3 -A25 'SourceInfo\|MusicInfo\|getMusicInfo\|OnEventListener' "$j" | head -260
          done
